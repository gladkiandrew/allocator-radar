name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + wall tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The suite is self-contained: tests/conftest.py gives every test its own temp data dir,
      # DuckDB file and throwaway lake key, and turns GLiNER off. No data/, no ~/.config key,
      # no Claude CLI and no API key are needed. Model downloads are blocked so a test can't
      # quietly depend on one. The slow GLiNER tests stay opt-in (RADAR_TEST_GLINER=1, `make wall`).
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (from the lockfile)
        run: uv sync --frozen

      - name: Test (same command as `make test`)
        run: make test
