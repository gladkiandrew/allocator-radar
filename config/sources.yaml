# MANUAL = a human reads it in a browser and may enter a dated, cited fact by hand,
#          or drop a downloaded file into inbox/manual/. The system never fetches it.
# DROP / HARD_REJECT = never fetched, never linked as a data source.
#
# robots.txt is re-checked live on every crawl regardless of the verdict below.

