# Readiness tiers. A tier is never a score; it is derived from APPROVED signals by
# the rules below and always shown with the signals that produced it.
# Only signals with review_status = approved (a person) or auto_approved (config/auto_approval.yaml) count. event_date is the
# source-native date (meeting, notice, or filing date), never the fetch date.
#
# Evaluation order: tiers are checked top to bottom; the first tier with a
# matching approved signal inside its window wins. If no signal matches,
# WATCHING applies when a new document was fetched within coverage.stale_after_days,
# otherwise STALE.

tiers:
  - tier: DEPLOYING
    window_days: 90
    meaning: "A search or RFP is open, finalists were named, or a mandate was awarded."
    signal_types:
      - SEARCH_OPENED
      - RFP_ISSUED
      - FINALISTS_NAMED
      - MANDATE_AWARDED
    # Searches count only when the hire is an investment manager. A search for
    # legal counsel, an actuary or a custodian is not capital deployment. A search
    # for an investment consultant does not count either (to count it here, add
    # `consultant` to the lists below).
    qualifiers:
      SEARCH_OPENED: [manager]
      RFP_ISSUED: [manager]
      FINALISTS_NAMED: [manager]
      MANDATE_AWARDED: [manager]

  - tier: PREPARING
    window_days: 180
    meaning: >-
      A mandate awarded or a commitment made, target allocation raised, IPS amended, asset-liability
      or pacing study adopted, consultant changed, or an incumbent placed on watch or terminated.
    signal_types:
      - MANDATE_AWARDED             # 91-180 days old (newer ones are DEPLOYING); manager hires only
      - COMMITMENT_MADE
      - TARGET_ALLOCATION_CHANGED   # only when qualifier = increase (see below)
      - IPS_AMENDED
      - ASSET_LIABILITY_STUDY
      - PACING_PLAN_ADOPTED
      - CONSULTANT_CHANGED
      - MANAGER_ON_WATCH
      - MANAGER_TERMINATED
    qualifiers:
      MANDATE_AWARDED: [manager]
      TARGET_ALLOCATION_CHANGED: [increase]

coverage:
  stale_after_days: 120
  meaning: "No new document fetched for this allocator in 120 days."

# Tier shown when nothing above applies and coverage is current.
fallback_tier: WATCHING
stale_tier: STALE
