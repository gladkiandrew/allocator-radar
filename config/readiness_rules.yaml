# Readiness tiers. A tier is never a score; it is derived from APPROVED signals by
# the rules below and always shown with the signals that produced it.
# Only signals with review_status = approved count. event_date is the
# source-native date (meeting, notice, or filing date), never the fetch date.
#
# Evaluation order: tiers are checked top to bottom; the first tier with a
# matching approved signal inside its window wins. If no signal matches,
# WATCHING applies when a new document was fetched within coverage.stale_after_days,
# otherwise STALE.

tiers:
  - tier: DEPLOYING
    window_days: 90
    meaning: "A search or RFP is open, finalists were named, or a mandate was awarded."
    signal_types:
      - SEARCH_OPENED
      - RFP_ISSUED
      - FINALISTS_NAMED
      - MANDATE_AWARDED

  - tier: PREPARING
    window_days: 180
    meaning: >-
      Target allocation raised, IPS amended, asset-liability or pacing study adopted,
      consultant changed, or an incumbent placed on watch or terminated.
    signal_types:
      - TARGET_ALLOCATION_CHANGED   # only when qualifier = increase (see below)
      - IPS_AMENDED
      - ASSET_LIABILITY_STUDY
      - PACING_PLAN_ADOPTED
      - CONSULTANT_CHANGED
      - MANAGER_ON_WATCH
      - MANAGER_TERMINATED
    qualifiers:
      TARGET_ALLOCATION_CHANGED: [increase]

coverage:
  stale_after_days: 120
  meaning: "No new document fetched for this allocator in 120 days."

# Tier shown when nothing above applies and coverage is current.
fallback_tier: WATCHING
stale_tier: STALE
